<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inscriptions – Club Cybersécurité (espace enseignant)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700;800&display=swap">
<style>
:root{--marine:#135631;--marine-2:#1d7a45;--marine-3:#0b3320;--or:#F5B800;--fond:#F2F8F4;--texte:#1c2b22;--texte-2:#4a5f52;--ligne:#d6e4db;--rouge:#C62828;--vert:#1E7B3C;--pale:#e7f5ec;--orp:#fff6d6;--titre:"Roboto Condensed","Arial Narrow",sans-serif;--corps:"Inter","Segoe UI",Calibri,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 var(--corps);color:var(--texte);background:var(--fond);overflow-x:hidden}
h1,h2{font-family:var(--titre);color:var(--marine);margin:0 0 .4em;line-height:1.2}
.barre{background:var(--marine);color:#fff;border-bottom:4px solid var(--or)}
.barre-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barre img{width:42px;height:42px;border-radius:50%;background:#fff}
.barre b{font-family:var(--titre);font-size:19px}
.barre .sp{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.page{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.btn{display:inline-block;background:var(--or);color:var(--marine-3);font:700 15px var(--corps);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;min-height:44px;text-decoration:none}
.btn:hover{background:#ffc824}
.btn.sec{background:#fff;color:var(--marine);border:2px solid var(--marine)}
.btn.petit{min-height:36px;padding:6px 12px;font-size:14px}
.btn.rouge{background:#fff;color:var(--rouge);border:2px solid var(--rouge)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:20px;margin-bottom:18px}
.centre{max-width:520px;margin:40px auto;text-align:center}
.msg{color:var(--texte-2)}
.err{color:var(--rouge);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--ligne);border-left:6px solid var(--marine);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--titre);font-size:30px;color:var(--marine);line-height:1}
.stat span{font-size:13px;color:var(--texte-2)}
.filtres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtres input,.filtres select{font:16px var(--corps);padding:9px 12px;border:1px solid #b9cdbf;border-radius:8px;min-height:44px;background:#fff;min-width:0}
.filtres input{flex:1 1 220px}
.tw{background:#fff;border:1px solid var(--ligne);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--marine);color:#fff;text-align:left;padding:9px 12px;font-family:var(--titre);font-size:15px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--ligne);vertical-align:top}
tr:nth-child(even) td{background:#fafdfb}
td select{font:14px var(--corps);padding:5px;border-radius:6px;border:1px solid #b9cdbf;min-height:36px}
td input[type=checkbox]{width:22px;height:22px}
.motiv{max-width:320px;color:var(--texte-2);font-size:13.5px}
.vide{padding:24px;text-align:center;color:var(--texte-2)}
@media(max-width:860px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 table,thead,tbody,tr,td{display:block}
 thead{display:none}
 tr{border-bottom:6px solid var(--fond);padding:6px 0}
 td{border:0;padding:4px 14px;display:flex;gap:10px}
 td::before{content:attr(data-l);font-weight:700;color:var(--marine);min-width:104px;flex:none}
 td .motiv{max-width:none}
}
</style>
</head>
<body>
<header class="barre"><div class="barre-in">
 <img src="logo.png" alt="Logo du Lycée Oued Ellil" width="42" height="42"><b>Inscriptions du club</b>
 <div class="sp"><span id="qui"></span><button class="btn sec petit" id="bOut" type="button" hidden>Se déconnecter</button></div>
</div></header>
<main class="page">
 <div id="etat" class="carte centre"><p class="msg">Chargement…</p></div>
 <div id="app" hidden>
  <div class="stats">
   <div class="stat"><b id="sT">0</b><span>inscriptions</span></div>
   <div class="stat"><b id="s3">0</b><span>en 3ème SI</span></div>
   <div class="stat"><b id="s4">0</b><span>en 4ème SI</span></div>
   <div class="stat"><b id="sF">0</b><span>fiches signées reçues</span></div>
  </div>
  <div class="filtres">
   <input id="q" type="search" placeholder="Rechercher un nom, un téléphone…" aria-label="Rechercher">
   <select id="fc" aria-label="Classe"><option value="">Toutes les classes</option><option>3ème Sciences Informatiques</option><option>4ème Sciences Informatiques</option></select>
   <select id="fs" aria-label="Statut"><option value="">Tous les statuts</option><option>En attente</option><option>Retenu</option><option>Liste d'attente</option><option>Refusé</option></select>
   <button class="btn" id="bCsv" type="button">Exporter en CSV</button>
  </div>
  <div class="tw"><table><thead><tr><th>Date</th><th>Élève</th><th>Classe</th><th>Niveau</th><th>Contact</th><th>Parent</th><th>Motivation</th><th>Fiche reçue</th><th>Statut</th><th></th></tr></thead><tbody id="corps"></tbody></table><div id="vide" class="vide" hidden>Aucune inscription ne correspond.</div></div>
 </div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const etat = $('etat');
function carte(html) { etat.hidden = false; $('app').hidden = true; etat.replaceChildren(); html.forEach((n) => etat.appendChild(n)); }
function el(t, txt, cls) { const e = document.createElement(t); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; }

if (!window.FIREBASE_CONFIG) {
  carte([el('h2', 'Base de données non configurée'), el('p', 'Renseigne firebase-config.js avec la configuration de ton projet Firebase (voir FIREBASE.md).', 'msg')]);
} else {
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try {
    const [A, Au, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
    const app = A.initializeApp(window.FIREBASE_CONFIG);
    const auth = Au.getAuth(app), db = F.getFirestore(app);
    let rows = [], unsub = null;

    const connexion = (msg) => {
      const b = el('button', 'Se connecter avec Google', 'btn'); b.type = 'button';
      b.onclick = () => Au.signInWithPopup(auth, new Au.GoogleAuthProvider()).catch(() => connexion('Connexion annulée ou refusée.'));
      const n = [el('h2', 'Espace enseignant'), el('p', 'Connecte-toi avec le compte Google autorisé pour voir les inscriptions.', 'msg'), b];
      if (msg) n.push(el('p', msg, 'err'));
      carte(n);
    };
    $('bOut').onclick = () => Au.signOut(auth);

    const ts = (d) => d && d.createdAt && d.createdAt.toDate ? d.createdAt.toDate() : null;
    const fmt = (dt) => dt ? dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';

    function filtrer() {
      const q = $('q').value.trim().toLowerCase(), c = $('fc').value, s = $('fs').value;
      return rows.filter((r) => (!c || r.classe === c) && (!s || r.statut === s) &&
        (!q || [r.nom, r.prenom, r.tel, r.ptel, r.pnom, r.email].join(' ').toLowerCase().includes(q)));
    }
    function rendre() {
      $('sT').textContent = rows.length;
      $('s3').textContent = rows.filter((r) => r.classe.startsWith('3')).length;
      $('s4').textContent = rows.filter((r) => r.classe.startsWith('4')).length;
      $('sF').textContent = rows.filter((r) => r.ficheRecue).length;
      const l = filtrer(), tb = $('corps'); tb.replaceChildren();
      $('vide').hidden = l.length > 0;
      l.forEach((r) => {
        const tr = document.createElement('tr');
        const cell = (lab, ...nodes) => { const td = document.createElement('td'); td.dataset.l = lab; nodes.forEach((n) => td.appendChild(typeof n === 'string' ? document.createTextNode(n) : n)); tr.appendChild(td); return td; };
        cell('Date', fmt(ts(r)));
        cell('Élève', r.nom + ' ' + r.prenom);
        cell('Classe', r.classe.replace(' Sciences Informatiques', ' SI'));
        cell('Niveau', r.niveau.split(' :')[0]);
        cell('Contact', [r.tel, r.email].filter(Boolean).join(' · ') || '—');
        cell('Parent', r.pnom + ' · ' + r.ptel);
        cell('Motivation', el('div', r.motiv, 'motiv'));
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!r.ficheRecue; cb.setAttribute('aria-label', 'Fiche signée reçue');
        cb.onchange = () => F.updateDoc(F.doc(db, 'inscriptions', r.id), { ficheRecue: cb.checked });
        cell('Fiche reçue', cb);
        const sel = document.createElement('select'); sel.setAttribute('aria-label', 'Statut');
        ['En attente', 'Retenu', "Liste d'attente", 'Refusé'].forEach((o) => { const op = el('option', o); op.selected = o === r.statut; sel.appendChild(op); });
        sel.onchange = () => F.updateDoc(F.doc(db, 'inscriptions', r.id), { statut: sel.value });
        cell('Statut', sel);
        const del = el('button', 'Supprimer', 'btn rouge petit'); del.type = 'button';
        del.onclick = () => { if (window.confirm('Supprimer l\'inscription de ' + r.prenom + ' ' + r.nom + ' ?')) F.deleteDoc(F.doc(db, 'inscriptions', r.id)); };
        cell('', del);
        tb.appendChild(tr);
      });
    }
    ['q', 'fc', 'fs'].forEach((i) => $(i).addEventListener('input', rendre));

    const nettoie = (v) => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    $('bCsv').onclick = () => {
      const h = ['Date', 'Nom', 'Prénom', 'Classe', 'Niveau', 'Téléphone élève', 'E-mail', 'Motivation', 'Parent', 'Téléphone parent', 'Fiche reçue', 'Statut'];
      const lignes = filtrer().map((r) => [fmt(ts(r)), r.nom, r.prenom, r.classe, r.niveau, r.tel, r.email, r.motiv, r.pnom, r.ptel, r.ficheRecue ? 'oui' : 'non', r.statut].map(nettoie).join(';'));
      const blob = new Blob(['﻿' + [h.map(nettoie).join(';'), ...lignes].join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'inscriptions-club-cyber.csv'; document.body.appendChild(a); a.click(); a.remove();
    };

    Au.onAuthStateChanged(auth, (u) => {
      if (unsub) { unsub(); unsub = null; }
      if (!u) { $('qui').textContent = ''; $('bOut').hidden = true; connexion(); return; }
      $('qui').textContent = u.email; $('bOut').hidden = false;
      unsub = F.onSnapshot(F.query(F.collection(db, 'inscriptions'), F.orderBy('createdAt', 'desc')), (snap) => {
        rows = snap.docs.map((d) => Object.assign({ classe: '', niveau: '', nom: '', prenom: '', motiv: '', pnom: '', ptel: '', statut: 'En attente' }, d.data(), { id: d.id }));
        etat.hidden = true; $('app').hidden = false; rendre();
      }, () => {
        const b = el('button', 'Changer de compte', 'btn sec'); b.type = 'button'; b.onclick = () => Au.signOut(auth);
        carte([el('h2', 'Accès refusé'), el('p', 'Ce compte n\'est pas autorisé à lire les inscriptions.', 'err'), b]);
      });
    });
  } catch (e) {
    carte([el('h2', 'Erreur de chargement'), el('p', 'Impossible de charger Firebase. Vérifie la connexion et la configuration.', 'err')]);
  }
}
</script>
</body>
</html>
